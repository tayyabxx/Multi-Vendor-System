<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MarketHub - Create Account</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; position: relative; }

        .blob-1 { position: absolute; top: 10px; left: 10px; width: 400px; height: 400px; background: rgba(79, 70, 229, 0.25); filter: blur(100px); border-radius: 50%; z-index: 0; }
        .blob-2 { position: absolute; bottom: 10px; right: 10px; width: 400px; height: 400px; background: rgba(6, 182, 212, 0.2); filter: blur(100px); border-radius: 50%; z-index: 0; }

        .auth-container { position: relative; z-index: 10; background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 480px; }

        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header .icon { font-size: 36px; margin-bottom: 8px; display: inline-block; }
        .brand-header h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .brand-header p { font-size: 13px; color: #94a3b8; }

        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 15px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 11px 14px; border-radius: 10px; color: white; font-size: 14px; transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        select option { background: #1e293b; color: white; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); transition: transform 0.2s; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-1px); }

        .login-redirect { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
        .login-redirect a { color: #818cf8; text-decoration: none; font-weight: 600; }
        .login-redirect a:hover { text-decoration: underline; }
    </style>
    <script>
        function toggleVendorFields() {
            var role = document.getElementById("roleSelect").value;
            var vendorFields = document.getElementById("vendorFields");
            vendorFields.style.display = (role === "VENDOR") ? "block" : "none";
        }
    </script>
</head>
<body>
<div class="blob-1"></div>
<div class="blob-2"></div>

<div class="auth-container">
    <div class="brand-header">
        <div class="icon">📝</div>
        <h2>Create Account</h2>
        <p>Join MarketHub as a Buyer or Vendor</p>
    </div>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Account Role</label>
            <select name="role" id="roleSelect" onchange="toggleVendorFields()">
                <option value="BUYER">🛒 Buyer / Customer Account</option>
                <option value="VENDOR">🏪 Vendor / Store Owner Account</option>
            </select>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" placeholder="Abdul Munib" required />
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="name@domain.com" required />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
        </div>

        <div id="vendorFields" style="display:none; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 15px; margin-top: 15px;">
            <div class="form-group">
                <label>Store Name</label>
                <input type="text" name="storeName" placeholder="Your Store Name" />
            </div>
            <div class="form-group">
                <label>CNIC Number</label>
                <input type="text" name="cnic" placeholder="37405-XXXXXXX-X" />
            </div>
        </div>

        <button type="submit" class="btn-submit">Complete Registration ✨</button>
    </form>

    <div class="login-redirect">
        Already have an account? <a href="/login">Sign In Here 🔑</a>
    </div>
</div>
</body>
</html>
