<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MarketHub - Secure Sign In</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .blob-1 { position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: rgba(79, 70, 229, 0.3); filter: blur(100px); border-radius: 50%; z-index: 0; }
        .blob-2 { position: absolute; bottom: -100px; left: -100px; width: 400px; height: 400px; background: rgba(6, 182, 212, 0.2); filter: blur(100px); border-radius: 50%; z-index: 0; }
        .auth-container { position: relative; z-index: 10; background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 45px 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 420px; }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header .icon { font-size: 40px; margin-bottom: 10px; display: inline-block; }
        .brand-header h2 { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 10px; color: white; font-size: 14px; }
        select option { background: #1e293b; color: white; }
        input:focus, select:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .extra-links { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 13px; }
        .extra-links a { color: #818cf8; text-decoration: none; }
        .divider { margin: 20px 0; border: none; height: 1px; background: var(--border-color); }
        .btn-create { display: block; width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(129, 140, 248, 0.4); color: #a5b4fc; padding: 12px; border-radius: 10px; font-weight: 600; text-decoration: none; text-align: center; }
    </style>
</head>
<body>
<div class="blob-1"></div><div class="blob-2"></div>
<div class="auth-container">
    <div class="brand-header">
        <div class="icon">🔐</div>
        <h2>Welcome Back</h2>
        <p style="color:#94a3b8; font-size:13px;">Sign in to your MarketHub account</p>
    </div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Login As</label>
            <select name="role" required>
                <option value="BUYER">🛒 Buyer / Customer Account</option>
                <option value="VENDOR">🏪 Vendor / Store Owner Account</option>
            </select>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="name@domain.com" required />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">Sign In ✨</button>
    </form>
    <div class="extra-links">
        <a href="/forgot-password">Forgot password?</a>
        <a href="/">🏠 Home</a>
    </div>
    <hr class="divider">
    <div style="text-align: center;">
        <p style="font-size:13px; color:#94a3b8; margin-bottom:10px;">New to MarketHub?</p>
        <a href="/register" class="btn-create">Create a New Account 🌟</a>
    </div>
</div>
</body>
</html>
