<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MarketHub - Support & Contact</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; position: relative; }

        .blob-1 { position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: rgba(6, 182, 212, 0.25); filter: blur(100px); border-radius: 50%; z-index: 0; }

        .auth-container { position: relative; z-index: 10; background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 440px; }

        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header .icon { font-size: 36px; margin-bottom: 8px; display: inline-block; }
        .brand-header h2 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
        .brand-header p { font-size: 13px; color: #94a3b8; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, textarea { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); padding: 12px 14px; border-radius: 10px; color: white; font-size: 14px; transition: all 0.2s; }
        textarea { height: 110px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); transition: transform 0.2s; }
        .btn-submit:hover { transform: translateY(-1px); }

        .back-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .back-link a { color: #818cf8; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="blob-1"></div>

<div class="auth-container">
    <div class="brand-header">
        <div class="icon">💬</div>
        <h2>Enterprise Support</h2>
        <p>Our team is here to help 24/7</p>
    </div>

    <form action="#" method="post">
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" placeholder="Abdul Munib" required />
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="name@company.com" required />
        </div>
        <div class="form-group">
            <label>Message / Inquiry</label>
            <textarea placeholder="Describe your request..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message 🚀</button>
    </form>

    <div class="back-link">
        <a href="/">🏠 Back to Home</a>
    </div>
</div>
</body>
</html>
