<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MarketHub - Enterprise Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-gradient); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 800; background: linear-gradient(to right, #818cf8, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #cbd5e1; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.3); }

        .main-content { padding: 50px 8%; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
        .welcome-card { background: var(--card-bg); border: 1px solid var(--border-color); backdrop-filter: blur(16px); padding: 35px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin-bottom: 30px; }
        .welcome-card h1 { font-size: 28px; margin-bottom: 10px; color: #fff; }
        .welcome-card p { color: #94a3b8; font-size: 15px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 14px; backdrop-filter: blur(12px); }
        .stat-card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .stat-card .value { font-size: 24px; font-weight: 700; color: #38bdf8; }
    </style>
</head>
<body>
<header>
    <div class="logo">🌐 MarketHub Enterprise Portal</div>
    <div class="user-info">
        <span>Logged in as: <strong th:text="${user.email}" style="color: #fff;">user@email.com</strong></span>
        <a href="/login" class="btn-logout">Sign Out 🚪</a>
    </div>
</header>

<div class="main-content">
    <div class="welcome-card">
        <h1>Welcome back, <span th:text="${user.fullName}" style="color: #818cf8;">User</span>! 🎉</h1>
        <p>Role: <strong th:text="${user.role}" style="color: #38bdf8;">CUSTOMER</strong> | System status: Fully operational & secure.</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Account Status</h3>
            <div class="value">Active ✅</div>
        </div>
        <div class="stat-card">
            <h3>Security Protocol</h3>
            <div class="value">BCrypt 🔒</div>
        </div>
        <div class="stat-card">
            <h3>Platform Version</h3>
            <div class="value">v1.0 Enterprise</div>
        </div>
    </div>
</div>
</body>
</html>
